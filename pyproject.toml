[project]
name = "traffic-state-reconstruction-pinns"
version = "1.0.0"
description = "Data-driven, LWR, and ARZ-3 neural reconstruction of ring-road traffic states"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "tensorflow==2.21.0",
  "matplotlib==3.11.0",
]

[tool.setuptools]
packages = ["src"]
